/* ----- state ----- */
var lang = (function(){
  var saved = store.get('oo_lang');
  if(saved==='ko'||saved==='en') return saved;
  return /^ko/.test(navigator.language||'') ? 'ko' : 'en';
})();
var streak = 0;
var best = parseInt(store.get('oo_best')||'0',10) || 0;
var order = [];
var idx = 0;
var answered = false;

/* ----- elements ----- */
var $ = function(id){ return document.getElementById(id); };
var qcard=$('qcard'), scrim=$('scrim'), sheetBody=$('sheetBody');

/* ----- shuffle + draw next question ----- */
function reshuffle(){
  order = Q.map(function(_,i){return i;});
  for(var i=order.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=order[i];order[i]=order[j];order[j]=t; }
  idx=0;
}
function nextQ(){
  if(idx>=order.length) reshuffle();
  render(Q[order[idx++]]);
}

/* ----- render a question ----- */
function render(item){
  answered=false;
  var L=T[lang];
  var catLabel = item.r==='E'?L.east:(item.r==='W'?L.west:L.sci);
  var html='<span class="cat">'+catLabel+'</span>';
  html+='<h1 class="q">'+item.q[lang]+'</h1>';
  if(item.t==='ox'){
    html+='<div class="opts ox">'
      +'<button class="opt" data-v="O"><span class="glyph">O</span><span>'+L.truth+'</span></button>'
      +'<button class="opt" data-v="X"><span class="glyph">✕</span><span>'+L.falseTxt+'</span></button>'
      +'</div>';
  } else {
    html+='<div class="opts">';
    for(var i=0;i<item.o[lang].length;i++){
      html+='<button class="opt" data-v="'+i+'">'+item.o[lang][i]+'</button>';
    }
    html+='</div>';
  }
  qcard.innerHTML=html;
  var btns=qcard.querySelectorAll('.opt');
  btns.forEach(function(b){
    b.addEventListener('click', function(){ choose(item, b.getAttribute('data-v')); });
  });
}

/* ----- handle an answer ----- */
function choose(item, val){
  if(answered) return; answered=true;
  var L=T[lang];
  var correctVal = (item.t==='ox') ? item.a : String(item.a);
  var isCorrect = (val===correctVal);
  var btns=qcard.querySelectorAll('.opt');
  btns.forEach(function(b){
    b.disabled=true;
    var v=b.getAttribute('data-v');
    if(v===correctVal){ b.classList.add('correct'); if(isCorrect) addTag(b,L.tagAns); }
    else if(v===val){ b.classList.add('wrong'); addTag(b,L.tagPicked); }
    else b.classList.add('dim');
  });
  // explanation inline
  var ex=document.createElement('div');
  ex.className='explain';
  ex.innerHTML='<b>'+(isCorrect?'⭕':'❌')+'</b> '+item.e[lang];
  qcard.appendChild(ex);

  if(isCorrect){
    streak++;
    if(streak>best){ best=streak; store.set('oo_best',String(best)); }
    updateScore();
    track('answer_correct',{streak:streak});
    var nx=document.createElement('button');
    nx.className='next'; nx.textContent=L.next;
    nx.addEventListener('click', nextQ);
    qcard.appendChild(nx);
  } else {
    track('answer_wrong',{streak_ended:streak});
    var ended=streak;
    setTimeout(function(){ showResult(ended); }, 650);
  }
}
function addTag(btn,text){
  if(btn.querySelector('.tag')) return;
  var t=document.createElement('span'); t.className='tag'; t.textContent=text; btn.appendChild(t);
}

/* ----- score line ----- */
function updateScore(){ $('streak').textContent=streak; $('best').textContent=best; }

/* ----- result / certificate sheet ----- */
function showResult(ended){
  var L=T[lang];
  var rank=rankOf(ended);
  var dateStr=new Date().toLocaleDateString(lang==='ko'?'ko-KR':'en-US',{year:'numeric',month:'short',day:'numeric'});
  var serial='OO-'+String(Date.now()).slice(-6);
  var shopUrl = lang==='ko'?COUPANG_URL:AMAZON_URL;
  var html='';

  if(ended>=1){
    html+='<div class="result-head"><h2>'+L.resTitle+'</h2><p>'+L.resSub(ended)+'</p></div>';
    html+='<div class="cert" id="cert">'
      +'<div class="seal"><svg viewBox="0 0 100 90" aria-hidden="true"><circle cx="50" cy="30" r="19" fill="none" stroke="currentColor" stroke-width="11"/><line x1="50" y1="52" x2="50" y2="79" stroke="currentColor" stroke-width="11" stroke-linecap="round"/></svg></div>'
      +'<div class="kicker">'+L.certKicker+'</div>'
      +'<div class="big">'+ended+'</div>'
      +'<div class="unit">'+L.unit+'</div>'
      +'<div class="rank">'+rank[lang]+'</div>'
      +'<div class="meta"><span>'+serial+'</span><span>'+L.issued+' '+dateStr+'</span></div>'
      +'</div>';
    html+='<div class="actions">'
      +'<button class="btn-save" id="saveBtn">'+L.save+'</button>'
      +'<button class="btn-share" id="shareBtn">'+L.share+'</button>'
      +'</div>';
  } else {
    html+='<div class="result-head"><h2>'+L.res0Title+'</h2><p>'+L.res0Sub+'</p></div>';
  }

  html+='<a class="shop" id="shopLink" href="'+shopUrl+'" target="_blank" rel="noopener nofollow sponsored">📚 '+L.shop+'</a>';
  html+='<button class="retry" id="retryBtn">'+L.retry+' →</button>';

  sheetBody.innerHTML=html;
  scrim.classList.add('show');

  var rb=$('retryBtn');
  rb.addEventListener('click', function(){
    scrim.classList.remove('show');
    streak=0; updateScore();
    track('retry',{});
    setTimeout(nextQ,250);
  });
  var sl=$('shopLink');
  sl.addEventListener('click', function(){ track('shop_click',{region:lang==='ko'?'KR':'EN',streak_ended:ended}); });

  if(ended>=1){
    $('saveBtn').addEventListener('click', function(){ saveCert(ended,rank,dateStr,serial); });
    $('shareBtn').addEventListener('click', function(){ shareCert(ended); });
  }
}

/* ----- draw certificate to canvas (PNG) ----- */
function buildCanvas(ended,rank,dateStr,serial){
  var W=1080,H=1350,c=document.createElement('canvas');
  c.width=W;c.height=H;var x=c.getContext('2d');
  // bg
  x.fillStyle='#f5f5f7';x.fillRect(0,0,W,H);
  // card
  var m=70, cardW=W-m*2, cardH=H-m*2;
  roundRect(x,m,m,cardW,cardH,40); x.fillStyle='#ffffff';x.fill();
  x.lineWidth=2;x.strokeStyle='rgba(0,0,0,.08)';x.stroke();
  // soft top glow
  var g=x.createRadialGradient(W/2,m,40,W/2,m,cardW*0.8);
  g.addColorStop(0,'rgba(0,113,227,.08)');g.addColorStop(1,'rgba(0,113,227,0)');
  x.fillStyle=g;roundRect(x,m,m,cardW,cardH,40);x.fill();
  x.textAlign='center';
  // logo mark
  drawMark(x,W/2,m+150,1.7,'#3d444b');
  // kicker
  x.fillStyle='#6e6e73';x.font='600 30px -apple-system,Helvetica,Arial,sans-serif';
  x.fillText((T[lang].certKicker).toUpperCase(), W/2, m+340);
  // big number
  x.fillStyle='#1d1d1f';x.font='800 280px -apple-system,Helvetica,Arial,sans-serif';
  x.fillText(String(ended), W/2, m+640);
  // unit
  x.fillStyle='#6e6e73';x.font='600 40px -apple-system,Helvetica,Arial,sans-serif';
  x.fillText(T[lang].unit, W/2, m+710);
  // rank pill
  var rk=rank[lang];x.font='700 44px -apple-system,Helvetica,Arial,sans-serif';
  var tw=x.measureText(rk).width, pw=tw+90, px=W/2-pw/2, py=m+770, ph=86;
  roundRect(x,px,py,pw,ph,43);x.fillStyle='rgba(0,113,227,.08)';x.fill();
  x.lineWidth=2;x.strokeStyle='rgba(0,113,227,.3)';x.stroke();
  x.fillStyle='#0071e3';x.fillText(rk,W/2,py+58);
  // footer meta
  x.fillStyle='#6e6e73';x.font='500 28px -apple-system,Helvetica,Arial,sans-serif';
  x.textAlign='left';x.fillText(serial, m+60, H-m-90);
  x.textAlign='right';x.fillText(T[lang].issued+' '+dateStr, W-m-60, H-m-90);
  x.textAlign='center';x.fillStyle='#1d1d1f';x.font='600 32px -apple-system,Helvetica,Arial,sans-serif';
  x.fillText('OnlyOne · 그거알아?  Did You Know?', W/2, H-m-130);
  return c;
}
function drawMark(ctx,cx,cy,s,color){
  ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineCap='round';
  ctx.lineWidth=22*s;
  ctx.beginPath();ctx.arc(cx,cy-20*s,38*s,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy+24*s);ctx.lineTo(cx,cy+78*s);ctx.stroke();
  ctx.restore();
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

function saveCert(ended,rank,dateStr,serial){
  try{
    var c=buildCanvas(ended,rank,dateStr,serial);
    c.toBlob(function(blob){
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url;a.download='onlyone-그거알아-'+ended+'.png';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},1000);
      toast(T[lang].saved);
      track('card_save',{streak:ended});
    },'image/png');
  }catch(e){ toast('⚠'); }
}

function shareUrl(ended){
  var base=location.origin+location.pathname;
  return base+'?s='+ended;
}
function shareCert(ended){
  var L=T[lang];
  var url=shareUrl(ended);
  var text=L.shareText(ended);
  track('card_share',{streak:ended});
  // try sharing the image too
  function fallbackLink(){
    if(navigator.share){
      navigator.share({title:'그거알아? · Did You Know?',text:text,url:url}).catch(function(){copyLink(url);});
    } else copyLink(url);
  }
  try{
    var c=buildCanvas(ended,rankOf(ended),new Date().toLocaleDateString(lang==='ko'?'ko-KR':'en-US'),'OO-'+String(Date.now()).slice(-6));
    c.toBlob(function(blob){
      var file=new File([blob],'onlyone.png',{type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:'그거알아?',text:text+'\n'+url}).catch(fallbackLink);
      } else fallbackLink();
    },'image/png');
  }catch(e){ fallbackLink(); }
}
function copyLink(url){
  try{ navigator.clipboard.writeText(url); toast(T[lang].copied); }
  catch(e){ prompt('', url); }
}

/* ----- toast ----- */
var toastTimer;
function toast(msg){
  var t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1800);
}

/* ----- language ----- */
function applyLang(){
  document.documentElement.lang=lang;
  var L=T[lang];
  $('langKo').classList.toggle('on',lang==='ko');
  $('langEn').classList.toggle('on',lang==='en');
  $('lblStreak').textContent=L.streak;
  $('lblBest').textContent=L.best;
  $('footTagline').textContent=L.tagline;
  renderHero();
  // 쿠팡 고지문은 한글 모드에서만 노출
  $('affiliate').hidden = (lang!=='ko');
  setCookieText();
  if(currentItemIndex>=0) render(Q[currentItemIndex]); // re-render current if mid-question
}

/* ----- cookie consent ----- */
function setCookieText(){

  $('cookieText').innerHTML = IS_STRICT ? L.cookie : L.cookieSoft;
  $('cAccept').textContent = IS_STRICT ? L.accept : L.ok;

}
function showCookieIfNeeded(){
  var choice=store.get('oo_consent');
  if(choice==='granted' || choice==='denied') return; // already chose
  if(!IS_STRICT){
    // 비EEA: 분석 기본 허용, 안내 배너만 (확인 시 닫힘)
    $('cookie').classList.add('show');
  } else {
    $('cookie').classList.add('show');
  }
}
$('cAccept').addEventListener('click',function(){
  gtag('consent','update',{analytics_storage:'granted'});
  store.set('oo_consent','granted');
  $('cookie').classList.remove('show');
  track('consent',{value:'granted'});
});
$('cDecline').addEventListener('click',function(){
  gtag('consent','update',{analytics_storage:'denied'});
  store.set('oo_consent','denied');
  $('cookie').classList.remove('show');
});

/* ----- incoming share ----- */
function checkInvite(){
  var p=new URLSearchParams(location.search);
  var s=parseInt(p.get('s')||'',10);
  if(s>0){
    inviteStreak=s;
    renderHero();
    track('arrive_from_share',{target:s});
  }
}

/* ----- init ----- */
reshuffle();
applyLang();
updateScore();
checkInvite();
nextQ();
showCookieIfNeeded();
</script>
